name: test
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the kernel the plugins are tested against; pin to a tag once the kernel is sealed
      - run: pip install "ngui[dev] @ git+https://github.com/ilkermansur/nicegui-core@main"
      - run: pytest -q
